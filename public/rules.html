<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Hot Take Rules</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="appbar"><a class="logo" href="/" style="color:inherit;text-decoration:none">Hot<span>Take</span></a></header>
    <main class="stage">
      <div class="stage-inner">
        <div class="stage-head"><span class="eyebrow">Rules</span><h1>How to play</h1></div>
        <section class="panel rules" id="rules"></section>
        <a class="btn yellow" href="/">Back to the game</a>
      </div>
    </main>
  </div>
  <script src="/rules.js"></script>
  <script>
    // Optional ?points=&hand= let the pop-over's "open in new tab" link carry the room's settings.
    const q = new URLSearchParams(location.search);
    const num = (k) => (/^\d{1,2}$/.test(q.get(k) || '') ? Number(q.get(k)) : undefined);
    document.getElementById('rules').innerHTML = HotTakeRules.html({ pointsToWin: num('points'), handSize: num('hand') });
  </script>
</body>
</html>
